name: Keep Render awake

# Render Hobby (plan free de apps/api) duerme el servicio tras 15 min sin
# tráfico y tarda ~1 min en despertar en el próximo request — confirmado
# en producción (login lento tras inactividad, rápido en el segundo
# intento inmediato).
#
# ESTE WORKFLOW SOLO ES BACKUP — NO ES LA DEFENSA PRINCIPAL (sesión
# 2026-09-18). Medido con `gh run list`: pese al cron de */10 min, GitHub
# ejecutó este schedule con un gap PROMEDIO de 253 min (máx. 715 min ≈
# 12hs) en 30 corridas reales — GitHub throttlea/coalesce schedules de
# alta frecuencia sin SLA, documentado como posible pero no esperábamos
# que fuera la norma y no la excepción. Con huecos de hasta 12hs, Render
# se duerme igual la gran mayoría del tiempo — este workflow por sí solo
# NO resolvía el cold start reportado por el usuario.
#
# La defensa real es un monitor externo (UptimeRobot/cron-job.org)
# pegándole a /health cada 5 min — esos servicios sí cumplen el intervalo.
# Se deja este workflow corriendo igual como backup gratuito de costo
# marginal (algunas corridas SÍ caen en la ventana correcta), pero no
# asumas que alcanza solo con esto.
#
# Solo corre en el horario real de uso del gym (8am-11pm hora Argentina)
# para no gastar de más las 750 hs/mes gratis del plan de Render (ver
# docs/hld-mvp.md §5). Cálculo del cron: 8am-11pm ART (UTC-3) =
# 11:00-02:00 UTC (cruza medianoche) → hora UTC 11-23 más 0-2.
#
# workflow_dispatch permite dispararlo a mano para probar sin esperar el
# cron.
on:
  schedule:
    - cron: '*/10 11-23,0-2 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping /health
        # --max-time 20 (el valor original) le fallaba con exit 28
        # (timeout) al pegarle a un Render recién dormido — Render puede
        # tardar hasta ~1 min en levantar el proceso desde cero, no 20s.
        # --retry porque durante el arranque puede devolver 502/503 antes
        # de terminar de bindear el puerto, no solo tardar.
        run: >
          curl -sf --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors
          https://app-gimnasio.onrender.com/health
