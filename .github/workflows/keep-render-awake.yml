name: Keep Render awake

# Render Hobby (plan free de apps/api) duerme el servicio tras 15 min sin
# tráfico y tarda ~1 min en despertar en el próximo request — confirmado
# en producción (login lento tras inactividad, rápido en el segundo
# intento inmediato). Este ping evita el sleep, pero SOLO en el horario
# real de uso del gym (8am-11pm hora Argentina) — mantenerlo despierto
# 24/7 consumiría ~720-744 de las 750 hs/mes gratis del plan, sin margen
# para nada más en el workspace de Render (ver docs/hld-mvp.md §5).
#
# Cálculo del cron: 8am-11pm ART (UTC-3) = 11:00-02:00 UTC (cruza
# medianoche) → hora UTC 11-23 más 0-2. Cada 10 min — Render duerme a los
# 15, esto deja margen contra el delay que GitHub documenta en schedules
# durante picos de carga (github.com/actions, "high load" a horas en
# punto). Consumo estimado: ~16 hs/día de Render (~486 hs/mes, dentro del
# cupo) y unos pocos minutos/día de Actions (lejísimos del límite gratis).
#
# workflow_dispatch permite dispararlo a mano para probar sin esperar el
# cron.
on:
  schedule:
    - cron: '*/10 11-23,0-2 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping /health
        # --max-time 20 (el valor original) le fallaba con exit 28
        # (timeout) al pegarle a un Render recién dormido — Render puede
        # tardar hasta ~1 min en levantar el proceso desde cero, no 20s.
        # --retry porque durante el arranque puede devolver 502/503 antes
        # de terminar de bindear el puerto, no solo tardar.
        run: >
          curl -sf --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors
          https://app-gimnasio.onrender.com/health
